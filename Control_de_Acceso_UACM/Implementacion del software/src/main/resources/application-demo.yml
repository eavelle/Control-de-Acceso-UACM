# Perfil de demostración: base de datos H2 en memoria.
# Sirve para revisar la Etapa 1 sin instalar MySQL/MariaDB.
# Se activa con: mvn spring-boot:run -Dspring-boot.run.profiles=demo
# o con la variable de entorno SPRING_PROFILES_ACTIVE=demo.
#
# Los datos viven solo mientras la aplicación está encendida. Al reiniciar,
# se vuelven a cargar los datos de demostración automáticamente.

spring:
  datasource:
    url: jdbc:h2:mem:controlacceso;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  seed:
    enabled: true
