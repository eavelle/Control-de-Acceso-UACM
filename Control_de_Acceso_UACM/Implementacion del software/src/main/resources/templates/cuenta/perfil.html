<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Mi perfil')}"></head>
<body class="bg-plantel">
<div th:replace="~{fragmentos/comunes :: nav}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="mb-4">
                <h1 class="h3 mb-1">Mi perfil</h1>
                <p class="text-muted mb-0">Datos de tu cuenta en el sistema.</p>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="avatar-iniciales mb-2"
                             th:text="${#strings.substring(cuenta.nombre, 0, 1)}">A</div>
                        <h2 class="h4 mb-1" th:text="${cuenta.nombre}">Nombre</h2>
                        <span class="badge bg-secondary" th:text="${cuenta.rol.descripcion}">Rol</span>
                    </div>

                    <dl class="row mb-0">
                        <dt class="col-sm-4">Usuario</dt>
                        <dd class="col-sm-8"><code th:text="${cuenta.username}">usuario</code></dd>

                        <dt class="col-sm-4">Correo</dt>
                        <dd class="col-sm-8" th:text="${cuenta.correo}">correo@uacm.edu.mx</dd>

                        <dt class="col-sm-4">Estado</dt>
                        <dd class="col-sm-8">
                            <span class="badge"
                                  th:classappend="${cuenta.estado.name() == 'ACTIVA' ? 'bg-success' : (cuenta.estado.name() == 'BLOQUEADA' ? 'bg-warning text-dark' : 'bg-secondary')}"
                                  th:text="${cuenta.estado.descripcion}">Activa</span>
                        </dd>

                        <dt class="col-sm-4">Fecha de creación</dt>
                        <dd class="col-sm-8"
                            th:text="${#temporals.format(cuenta.fechaCreacion, 'dd/MM/yyyy HH:mm')}">01/01/2026 08:00</dd>

                        <dt class="col-sm-4">Último acceso</dt>
                        <dd class="col-sm-8">
                            <span th:if="${cuenta.ultimoAcceso != null}"
                                  th:text="${#temporals.format(cuenta.ultimoAcceso, 'dd/MM/yyyy HH:mm')}">01/01/2026 08:00</span>
                            <span th:if="${cuenta.ultimoAcceso == null}" class="text-muted">Sin registros</span>
                        </dd>
                    </dl>
                </div>
                <div class="card-footer bg-white text-end">
                    <a class="btn btn-outline-uacm" th:href="@{/cuenta/password}">
                        <i class="bi bi-key"></i> Cambiar contraseña
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragmentos/comunes :: footer}"></div>
</body>
</html>
