<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Confirmar validación manual')}"></head>
<body class="bg-plantel">
<div th:replace="~{fragmentos/comunes :: nav}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-person-check"></i> Confirmar validación manual
                </div>
                <div class="card-body text-center">
                    <div class="avatar-iniciales mb-3" th:text="${confirmacion.iniciales}">AL</div>
                    <h1 class="h4 mb-1" th:text="${confirmacion.nombre}">Nombre</h1>
                    <p class="text-muted mb-1">
                        Matrícula: <strong th:text="${confirmacion.matricula}">20260008</strong>
                    </p>
                    <p class="mb-3">
                        <span class="badge bg-secondary" th:text="${confirmacion.tipoUsuario}">Estudiante</span>
                        <span class="badge bg-success" th:text="${confirmacion.estadoUsuario}">Activo</span>
                    </p>

                    <div class="alert alert-warning text-start">
                        <i class="bi bi-exclamation-triangle"></i>
                        Compara la fotografía del directorio institucional con la persona que se presenta.
                        En este prototipo se muestran las iniciales porque no se ha integrado el directorio real de la UACM.
                    </div>

                    <form th:action="@{/guardia/acceso/manual/confirmar}" method="post">
                        <input type="hidden" name="usuarioId" th:value="${confirmacion.usuarioId}">
                        <div class="row g-3 mb-4 text-start">
                            <div class="col-md-6">
                                <label for="puntoAcceso" class="form-label">Punto de acceso</label>
                                <select class="form-select" id="puntoAcceso" name="puntoAcceso">
                                    <option th:each="p : ${puntosAcceso}" th:value="${p}" th:text="${p}"
                                            th:selected="${p == confirmacion.puntoAcceso}">Acceso principal</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Método</label>
                                <input type="text" class="form-control" value="Manual por matrícula" disabled>
                            </div>
                        </div>
                        <div class="d-flex justify-content-center gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/guardia}">Cancelar</a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check2-circle"></i> Confirmar acceso
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragmentos/comunes :: footer}"></div>
</body>
</html>
