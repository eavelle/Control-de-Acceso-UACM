<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Cuenta de usuario')}"></head>
<body class="bg-plantel">
<div th:replace="~{fragmentos/comunes :: nav}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="h3 mb-1" th:text="${edicion} ? 'Editar cuenta' : 'Nueva cuenta'">Nueva cuenta</h1>
                <p class="text-muted mb-0">
                    <span th:if="${edicion}">Modifica los datos o el rol de la cuenta.</span>
                    <span th:if="${!edicion}">Crea una cuenta con contraseña temporal; se pedirá cambiarla al primer inicio de sesión.</span>
                </p>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="${edicion} ? '/admin/usuarios/' + cuenta.id + '/editar' : '/admin/usuarios/nuevo'"
                          th:object="${formulario}" method="post" novalidate>

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</p>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6" th:if="${edicion}">
                                <label class="form-label">Usuario institucional</label>
                                <input type="text" class="form-control" th:value="${cuenta.username}" disabled>
                            </div>
                            <div class="col-md-6" th:if="${!edicion}">
                                <label for="username" class="form-label">Usuario institucional</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                       placeholder="Ej. guardia2" autocomplete="off">
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correo" th:field="*{correo}"
                                       th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{correo}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="rol" class="form-label">Rol</label>
                                <select class="form-select" id="rol" th:field="*{rol}"
                                        th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid'">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.descripcion}">Rol</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{rol}"></div>
                            </div>

                            <div class="col-md-6" th:if="${edicion}">
                                <label class="form-label">Estado actual</label>
                                <input type="text" class="form-control" th:value="${cuenta.estado.descripcion}" disabled>
                            </div>

                            <div class="col-md-6" th:if="${!edicion}">
                                <label for="password" class="form-label">Contraseña temporal</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       autocomplete="new-password">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>

                            <div class="col-md-6" th:if="${!edicion}">
                                <label for="confirmarPassword" class="form-label">Confirmar contraseña temporal</label>
                                <input type="password" class="form-control" id="confirmarPassword"
                                       th:field="*{confirmarPassword}"
                                       th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'"
                                       autocomplete="new-password">
                                <div class="invalid-feedback" th:errors="*{confirmarPassword}"></div>
                            </div>
                        </div>

                        <div class="alert alert-info mt-4 mb-0" th:if="${!edicion}">
                            <i class="bi bi-key"></i>
                            La contraseña debe tener al menos 8 caracteres. El usuario deberá cambiarla en su primer inicio de sesión.
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a class="btn btn-outline-secondary" th:href="@{/admin/usuarios}">Cancelar</a>
                            <button type="submit" class="btn btn-uacm">
                                <i class="bi bi-save"></i> <span th:text="${edicion} ? 'Guardar cambios' : 'Crear cuenta'">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragmentos/comunes :: footer}"></div>
</body>
</html>
