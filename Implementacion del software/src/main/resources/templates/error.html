<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Error')}"></head>
<body class="bg-plantel">
<div th:replace="~{fragmentos/comunes :: nav}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 text-center">
            <div class="display-1 text-warning mb-3"><i class="bi bi-exclamation-triangle"></i></div>
            <h1 class="h3" th:text="${status != null ? 'Error ' + status : 'Ocurrió un error'}">Ocurrió un error</h1>
            <p class="text-muted"
               th:text="${mensajeError != null ? mensajeError : (message != null ? message : 'No se pudo completar la operación. Intenta de nuevo.')}">
                No se pudo completar la operación.
            </p>
            <a class="btn btn-uacm" th:href="@{/inicio}">
                <i class="bi bi-house-door"></i> Volver al inicio
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragmentos/comunes :: footer}"></div>
</body>
</html>
