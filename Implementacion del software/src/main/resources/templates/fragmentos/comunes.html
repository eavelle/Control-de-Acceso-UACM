<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Control de Acceso UACM'">Control de Acceso UACM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-plantel">
    <div class="body-overlay"></div>
    <nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-uacm shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/inicio}">
            <img th:src="@{/img/logo-uacm.png}" alt="Logo UACM" class="logo-navbar">
            <span>Control de Acceso UACM</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/inicio}"><i class="bi bi-house-door"></i> Inicio</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('GUARDIA')">
                    <a class="nav-link" th:href="@{/guardia}"><i class="bi bi-upc-scan"></i> Revisar identidad</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('DIRECCION_ENLACE')">
                    <a class="nav-link" th:href="@{/admin/usuarios}"><i class="bi bi-people"></i> Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('DIRECCION_ENLACE','GUARDIA')">
                    <a class="nav-link" th:href="@{/bitacora}"><i class="bi bi-journal-text"></i> Bitácora</a>
                </li>
            </ul>
            <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${principal != null ? principal.nombre : 'Usuario'}">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <span class="dropdown-item-text small text-muted"
                                  th:text="${principal != null ? principal.rol.descripcion : ''}">Rol</span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/cuenta/perfil}">Mi perfil</a></li>
                        <li><a class="dropdown-item" th:href="@{/cuenta/password}">Cambiar contraseña</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<footer th:fragment="footer" class="text-center text-muted py-4 small">
    Sistema de Control de Acceso UACM · Etapa 1 · Análisis y Modelamiento de Software
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
